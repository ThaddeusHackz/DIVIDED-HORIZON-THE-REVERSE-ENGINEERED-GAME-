name: One-off approved release attachment transfer
on:
  push:
    branches: ['arena/695b7985-game']
    paths: ['.release-staging/v0.3.1-prototype/**']
permissions:
  contents: read
jobs:
  upload:
    if: github.repository == 'ThaddeusHackz/GAME' && startsWith(github.event.head_commit.message, 'Stage approved v0.3.1 release attachment transfer')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Verify the exact approved bundles and existing draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd .release-staging/v0.3.1-prototype
          printf '%s  %s\n' 'f4837277c462835b07677bdf526d59f263ee08ca998685caefe208ae54365d46' 'DIVIDED_HORIZON_Windows_Combat_Slice_0.3.1.zip' | sha256sum -c -
          printf '%s  %s\n' '92489b071a0c026743444e45772fdd6d225430b1d38f2d34edce235382217866' 'DIVIDED_HORIZON_Combat_Slice_0.3.1_Source.zip' | sha256sum -c -
          sha256sum -c DIVIDED_HORIZON_Windows_Combat_Slice_0.3.1.zip.sha256
          sha256sum -c DIVIDED_HORIZON_Combat_Slice_0.3.1_Source.zip.sha256
          python ../../tools/slice/validate_package.py DIVIDED_HORIZON_Windows_Combat_Slice_0.3.1.zip
          gh api repos/ThaddeusHackz/GAME/releases/413102523 > ../../.cache-release-check.json
          python -c 'import json; r=json.load(open("../../.cache-release-check.json")); assert r["draft"] and r["tag_name"]=="v0.3.1-prototype" and r["target_commitish"]=="0806cd2c05260c777fa2ff4552a2b811a9f4d62b"'
      - name: Attach existing verified files (do not rebuild or publish)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd .release-staging/v0.3.1-prototype
          gh release upload v0.3.1-prototype --repo ThaddeusHackz/GAME \
            DIVIDED_HORIZON_Windows_Combat_Slice_0.3.1.zip \
            DIVIDED_HORIZON_Windows_Combat_Slice_0.3.1.zip.sha256 \
            DIVIDED_HORIZON_Combat_Slice_0.3.1_Source.zip \
            DIVIDED_HORIZON_Combat_Slice_0.3.1_Source.zip.sha256 \
            READ_ME_FIRST.txt
